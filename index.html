<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Twilio - Sistema de Gestión de Contactos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="frontend/css/styles.css">
    <style>
        .security-blur {
            filter: blur(10px);
            pointer-events: none;
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }
        
        .toast.success {
            background-color: #28a745;
        }
        
        .toast.error {
            background-color: #dc3545;
        }
        
        .toast.warning {
            background-color: #ffc107;
            color: #212529;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .spinner {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }
        
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Login Container -->
    <div id="login-container" class="login-container">
        <div class="login-form">
            <h2><i class="fas fa-phone"></i> CRM Twilio</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>
            <div class="login-info">
                <p><strong>Usuarios de prueba:</strong></p>
                <p>Admin: admin / admin123</p>
                <p>Asesor: asesor / asesor123</p>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="hidden">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-phone"></i> CRM Twilio</h1>
                <div class="user-section">
                    <span id="user-info"></span>
                    <button id="logout-btn" class="btn-secondary">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </button>
                </div>
            </div>
        </header>

        <!-- Dashboard -->
        <section class="dashboard">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="total-contacts">0</h3>
                        <p>Total Contactos</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-phone-alt"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="contacted-today">0</h3>
                        <p>Contactados Hoy</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="pending-followup">0</h3>
                        <p>Pendientes</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Contacts Section -->
        <section class="contacts-section">
            <div class="section-header">
                <h2><i class="fas fa-address-book"></i> Gestión de Contactos</h2>
                <button class="btn-primary admin-only" onclick="document.getElementById('add-contact-modal').style.display='flex'">
                    <i class="fas fa-plus"></i> Agregar Contacto
                </button>
            </div>

            <!-- Filters -->
            <div class="filters">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-contacts" placeholder="Buscar contactos...">
                </div>
                <select id="status-filter">
                    <option value="all">Todos los estados</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Contactado">Contactado</option>
                    <option value="Requiere_Seguimiento">Requiere Seguimiento</option>
                    <option value="No_Interesado">No Interesado</option>
                </select>
            </div>

            <!-- Contacts Table -->
            <div class="table-container">
                <table id="contacts-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Estado</th>
                            <th>Notas</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Contacts will be populated here -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Add Contact Modal -->
    <div id="add-contact-modal" class="overlay" style="display: none;">
        <div class="modal-content">
            <h3>Agregar Nuevo Contacto</h3>
            <form id="contact-form">
                <div class="form-group">
                    <label for="contact-name">Nombre:</label>
                    <input type="text" id="contact-name" required>
                </div>
                <div class="form-group">
                    <label for="contact-phone">Teléfono:</label>
                    <input type="tel" id="contact-phone" required>
                </div>
                <div class="form-group">
                    <label for="contact-email">Email:</label>
                    <input type="email" id="contact-email" required>
                </div>
                <div class="form-group">
                    <label for="contact-notes">Notas:</label>
                    <textarea id="contact-notes" rows="3"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" onclick="document.getElementById('add-contact-modal').style.display='none'" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Agregar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="frontend/js/app.js"></script>
</body>
</html>
